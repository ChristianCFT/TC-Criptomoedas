<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
</head>
<body>
    <main>
        <div class="layout-midia">
            <img src="../logo-img/logo-2.jpeg" alt="LogoCT">
        </div>
        <div class="layout-form">
            <form class="form-container" action="">
                <h2>Cadastre-se</h2>
                <div id="campos">

                    <div class="bloco-campo">
                        <label for="nome">Nome Completo</label>
                        <input type="text" name="nome" id="nome">
                    </div>

                    <div class="bloco-campo">
                        <label for="email">E-mail</label>
                        <input type="text" name="email" id="email">
                    </div>

                    <div class="bloco-campo">
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha">
                    </div>

                </div>
                <p id="p-termos">Ao continuar, você concorda com os <a href="">Termos de Uso</a> e <a href="">Política de Privacidade.</a></p>
                <button type="submit" id="btn-add">Cadastrar</button>
            </form>
        </div>
    </main>
    
</body>
</html>
