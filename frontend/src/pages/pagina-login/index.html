<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Neuton:ital,wght@0,200;0,300;0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<body>
    <header>
        <img src="../logo-img/logo-2.jpeg" alt="LogoCT">
    </header>
    <main>
        <form action="">
            <div class="container-principal">
                <div id="acessar">
                    <p>Acessar Conta</p>
                </div>
                <div class="inputs">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" placeholder="E-mail">
                    <label for="">Senha</label>
                    <input type="password" id="senha" placeholder="Senha">
                </div>
                <a id="esqueci-senha" href="">Esqueci minha senha</a>
                <button id="btn-acessar">ACESSAR CONTA</button>
            </div>
            <a id="cadastrar" href="">CADASTRE-SE AGORA MESMO</a>
        </form>
    </main>
</body>
</html>
